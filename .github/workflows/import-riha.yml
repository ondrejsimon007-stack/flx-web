name: Import FLX Riha images
on:
  push:
    paths:
      - '.github/workflows/import-riha.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Download optimize and add Riha
        run: |
          python - <<'PY'
          import json, pathlib, urllib.request, io
          from PIL import Image, ImageOps
          items=json.loads("[{\"name\":\"DSC03396.jpg\",\"url\":\"https://sdmntpreastus3.oaiusercontent.com/files/00000000-8340-8212-bd37-bed6c9b15628/raw?se=2026-11-18T13%3A04%3A39Z&sp=r&sv=2026-06-06&sr=b&scid=5e5d530d-21da-5b49-8aeb-aca1fa76ca64&skoid=002823aa-689d-47ca-9347-108c20f4f00d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-18T08%3A55%3A37Z&ske=2026-11-19T08%3A55%3A37Z&sks=b&skv=2026-06-06&sig=oLAHbk01SCGnENEwVIBSlpmpGGvZHg5vKBtxoRi95eE%3D\"},{\"name\":\"DSC03397.jpg\",\"url\":\"https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-8768-8210-8e73-c69d29363f6b/raw?se=2026-11-18T13%3A04%3A36Z&sp=r&sv=2026-06-06&sr=b&scid=21358075-3673-5f09-98f6-853e31ad0c88&skoid=002823aa-689d-47ca-9347-108c20f4f00d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-18T06%3A58%3A44Z&ske=2026-11-19T06%3A58%3A44Z&sks=b&skv=2026-06-06&sig=09vQd%2B5bdBb5Ot2aGnAS4des4OibpUbxTQkMO0UhqMM%3D\"},{\"name\":\"DSC03398.jpg\",\"url\":\"https://sdmntprnortheu.oaiusercontent.com/files/00000000-8b3c-81f4-bdf9-a2752fdc86d1/raw?se=2026-11-18T13%3A04%3A36Z&sp=r&sv=2026-06-06&sr=b&scid=1342142c-1800-5468-9156-a11ffc54c905&skoid=002823aa-689d-47ca-9347-108c20f4f00d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-18T09%3A07%3A43Z&ske=2026-11-19T09%3A07%3A43Z&sks=b&skv=2026-06-06&sig=PYQOnzgmO6QdIHeiA3XtDiEpsZmI%2B9wb2J1DlEOSDT0%3D\"},{\"name\":\"DSC03399.jpg\",\"url\":\"https://sdmntprpolandcentral.oaiusercontent.com/files/00000000-83b4-820a-9c0c-f75630c1d46f/raw?se=2026-11-18T13%3A04%3A36Z&sp=r&sv=2026-06-06&sr=b&scid=ea9270da-70a5-50b3-acf3-33b854e209cb&skoid=002823aa-689d-47ca-9347-108c20f4f00d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-18T08%3A13%3A40Z&ske=2026-11-19T08%3A13%3A40Z&sks=b&skv=2026-06-06&sig=zd%2B4XrgGClb3yWm19TcNdC9Yhd6BlxAxYTIBLvUjL5w%3D\"},{\"name\":\"DSC03400.jpg\",\"url\":\"https://sdmntprukwest.oaiusercontent.com/files/00000000-8c7c-8243-8ad8-c3dd97b114a0/raw?se=2026-11-18T13%3A04%3A36Z&sp=r&sv=2026-06-06&sr=b&scid=00bc1e83-b909-595b-98d5-e8d39e37fa10&skoid=002823aa-689d-47ca-9347-108c20f4f00d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-18T09%3A26%3A43Z&ske=2026-11-19T09%3A26%3A43Z&sks=b&skv=2026-06-06&sig=FkwFIaa6punQwSR0nFrf7s1EnHXaa7LQvTaZtsVQ2mI%3D\"},{\"name\":\"DSC03401.jpg\",\"url\":\"https://sdmntprnortheu.oaiusercontent.com/files/00000000-92b4-81f4-be23-9f3021f04909/raw?se=2026-11-18T13%3A04%3A38Z&sp=r&sv=2026-06-06&sr=b&scid=71f71e0b-c236-57fc-a8d2-1eb158519b45&skoid=002823aa-689d-47ca-9347-108c20f4f00d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-18T12%3A30%3A00Z&ske=2026-11-19T12%3A30%3A00Z&sks=b&skv=2026-06-06&sig=gKNiZSxkzD4w/nORTYre9i5ouZsb%2Bi9k6fedCBe0bYI%3D\"},{\"name\":\"DSC03403.jpg\",\"url\":\"https://sdmntprnortheu.oaiusercontent.com/files/00000000-5a3c-81f4-a487-5b9190be6014/raw?se=2026-11-18T13%3A04%3A39Z&sp=r&sv=2026-06-06&sr=b&scid=fa12d60d-eaed-5d04-a4f3-f21d69b5f791&skoid=002823aa-689d-47ca-9347-108c20f4f00d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-18T09%3A43%3A38Z&ske=2026-11-19T09%3A43%3A38Z&sks=b&skv=2026-06-06&sig=bR7rMGY3ZuPFlsU8yyeuMJRqYfVY5PfRKBLFwzzA9as%3D\"}]")
          folder=pathlib.Path("images");folder.mkdir(exist_ok=True)
          paths=[]
          for i,item in enumerate(items):
              request=urllib.request.Request(item["url"],headers={"User-Agent":"FLX-import/1.0"})
              with urllib.request.urlopen(request,timeout=100) as response: raw=response.read()
              im=ImageOps.exif_transpose(Image.open(io.BytesIO(raw))).convert("RGB")
              im.thumbnail((2000,2000),Image.Resampling.LANCZOS)
              path=folder/("riha-%02d.webp"%i)
              im.save(path,"WEBP",quality=82,method=6)
              paths.append(str(path))
              print(item["name"],len(raw),"->",path,path.stat().st_size)
          p=pathlib.Path("index.html")
          s=p.read_text(encoding="utf-8")
          if '"id":"20_Riha"' not in s:
              project={"id":"20_Riha","title":"Bytový interiér Říha","year":"","images":paths,"hero":paths[0],"details":{"description":"Realizace bytového interiéru","credits":"Realizace FLX"}}
              needle="const projects=["
              assert needle in s
              s=s.replace(needle,needle+json.dumps(project,ensure_ascii=False,separators=(",",":"))+",",1)
              p.write_text(s,encoding="utf-8")
          PY
      - name: Publish
        run: |
          git config user.name "FLX website automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html images/riha-*.webp
          if ! git diff --cached --quiet; then
            git commit -m "Publish Riha residential interior with optimized images"
            git push
          fi
