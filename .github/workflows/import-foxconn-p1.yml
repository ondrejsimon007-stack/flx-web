name: Import FLX Foxconn P1 images
on:
  push:
    paths:
      - '.github/workflows/import-foxconn-p1.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Optimize Foxconn P1 photos and add portfolio project
        run: |
          python - <<'PY'
          import json,pathlib,urllib.request,io
          from PIL import Image,ImageOps
          items=json.loads("[{\"number\":\"00\",\"url\":\"https://sdmntprukwest.oaiusercontent.com/files/00000000-cc9c-8243-b38d-92fc3ab126c4/raw?se=2026-11-18T15%3A10%3A21Z&sp=r&sv=2026-06-06&sr=b&scid=8767a36c-ca1c-5261-8734-01530506270c&skoid=002823aa-689d-47ca-9347-108c20f4f00d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-18T09%3A34%3A37Z&ske=2026-11-19T09%3A34%3A37Z&sks=b&skv=2026-06-06&sig=Yrmd%2BqvzUJeAnzKZ%2BIx5S6FL9HfBfPBHe6isSY/FfOY%3D\"},{\"number\":\"01\",\"url\":\"https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-65bc-8210-ab73-f661cc717edf/raw?se=2026-11-18T15%3A10%3A21Z&sp=r&sv=2026-06-06&sr=b&scid=f9bfdafb-41ac-52f3-9893-537e0b426145&skoid=002823aa-689d-47ca-9347-108c20f4f00d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-18T06%3A58%3A29Z&ske=2026-11-19T06%3A58%3A29Z&sks=b&skv=2026-06-06&sig=h6drlagxrQJMnniOKVlVCVN5Lnkh1PwkYp9jasYz74I%3D\"},{\"number\":\"02\",\"url\":\"https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-ce80-8210-93d7-5a89baf43262/raw?se=2026-11-18T15%3A10%3A21Z&sp=r&sv=2026-06-06&sr=b&scid=32bc3093-b1c0-5b31-9694-efa075697328&skoid=002823aa-689d-47ca-9347-108c20f4f00d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-18T06%3A03%3A39Z&ske=2026-11-19T06%3A03%3A39Z&sks=b&skv=2026-06-06&sig=Q//p/FjrYbTxA8fAXiumbg4HOsJNs9CO6sNtuicg1wA%3D\"},{\"number\":\"03\",\"url\":\"https://sdmntprnortheu.oaiusercontent.com/files/00000000-fc6c-81f4-af06-2d04fe9f2e03/raw?se=2026-11-18T15%3A10%3A21Z&sp=r&sv=2026-06-06&sr=b&scid=eb71cd91-cc31-5c78-bc5e-e8daddf61ad1&skoid=002823aa-689d-47ca-9347-108c20f4f00d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-18T10%3A17%3A45Z&ske=2026-11-19T10%3A17%3A45Z&sks=b&skv=2026-06-06&sig=qStKr6j6NGUs1mV49/SlB3i92v31YBgsz5mce2MhlJo%3D\"},{\"number\":\"04\",\"url\":\"https://sdmntprnortheu.oaiusercontent.com/files/00000000-4ba8-81f4-9740-73a4f7bb9ae0/raw?se=2026-11-18T15%3A10%3A21Z&sp=r&sv=2026-06-06&sr=b&scid=11513735-3e0a-5449-84e0-9ce27ee55d77&skoid=002823aa-689d-47ca