ercontent.com/files/00000000-de64-8210-8d0f-6ffb107137ea/raw?se=2026-11-18T15%3A10%3A23Z&sp=r&sv=2026-06-06&sr=b&scid=afe2fa12-9da8-5c25-9120-9eb1100f2a50&skoid=002823aa-689d-47ca-9347-108c20f4f00d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-18T09%3A16%3A47Z&ske=2026-11-19T09%3A16%3A47Z&sks=b&skv=2026-06-06&sig=Rug%2Bp2WDxUDEcspDsWh7f8yAMC%2BBDZpACW6K15xGa/g%3D\"},{\"number\":\"10\",\"url\":\"https://sdmntprukwest.oaiusercontent.com/files/00000000-6ce8-8243-8fc8-e23e11f50cd4/raw?se=2026-11-18T15%3A10%3A25Z&sp=r&sv=2026-06-06&sr=b&scid=72b85381-6d2e-5623-af93-6ce910e4067d&skoid=002823aa-689d-47ca-9347-108c20f4f00d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-18T06%3A45%3A24Z&ske=2026-11-19T06%3A45%3A24Z&sks=b&skv=2026-06-06&sig=KGmskesw2k%2BfmbuRjlkVQL1ywOwHSoaofe5NXIlA/yA%3D\"},{\"number\":\"11\",\"url\":\"https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-9a7c-8210-acb4-2962b6730eb3/raw?se=2026-11-18T15%3A10%3A25Z&sp=r&sv=2026-06-06&sr=b&scid=38512e25-4497-5f76-928b-12fc860db1af&skoid=002823aa-689d-47ca-9347-108c20f4f00d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-18T13%3A43%3A37Z&ske=2026-11-19T13%3A43%3A37Z&sks=b&skv=2026-06-06&sig=tx/RSnH47o4HyK4UMMBzxV9E%2BrV7%2BPDP915J%2B7esFis%3D\"},{\"number\":\"12\",\"url\":\"https://sdmntprnortheu.oaiusercontent.com/files/00000000-3dac-81f4-9074-b4ddfd54b1bd/raw?se=2026-11-18T15%3A10%3A25Z&sp=r&sv=2026-06-06&sr=b&scid=cf06e26a-c575-5d8b-8be0-959b744c4ca6&skoid=002823aa-689d-47ca-9347-108c20f4f00d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-18T08%3A39%3A35Z&ske=2026-11-19T08%3A39%3A35Z&sks=b&skv=2026-06-06&sig=J64WrHBdH1t3ksnp/sVhADKqG5NW8lMnfejx9RGMh3c%3D\"},{\"number\":\"13\",\"url\":\"https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-f828-8210-a9be-3ebd135c22f6/raw?se=2026-11-18T15%3A10%3A25Z&sp=r&sv=2026-06-06&sr=b&scid=2da83590-bf43-5137-ae05-53b9ee7423f9&skoid=002823aa-689d-47ca-9347-108c20f4f00d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-18T03%3A14%3A42Z&ske=2026-11-19T03%3A14%3A42Z&sks=b&skv=2026-06-06&sig=rxvSvzlaIZw4DGcKWzqKwCIhzvb57nLaeim%2BM/PW70w%3D\"}]")
          folder=pathlib.Path("images");folder.mkdir(exist_ok=True)
          paths=[]
          for item in items:
           req=urllib.request.Request(item["url"],headers={"User-Agent":"FLX-import/1.0"})
           with urllib.request.urlopen(req,timeout=120) as response: raw=response.read()
           im=ImageOps.exif_transpose(Image.open(io.BytesIO(raw))).convert("RGB")
           im.thumbnail((2000,2000),Image.Resampling.LANCZOS)
           path=folder/("foxconn-p1-%s.webp"%item["number"])
           im.save(path,"WEBP",quality=82,method=6)
           paths.append(str(path))
           print(path,path.stat().st_size)
          p=pathlib.Path("index.html");s=p.read_text(encoding="utf-8")
          if '"id":"21_FOXCONN_P1"' not in s:
           project={"id":"21_FOXCONN_P1","title":"Foxconn P1 – Cisco","year":"2022","images":paths,"hero":paths[0],"details":{"description":"Interiér Foxconn P1 – Cisco. Fotogalerie realizace zachycuje prostor a jeho interiérové detaily."}}
           needle="const projects=[";assert needle in s
           s=s.replace(needle,needle+json.dumps(project,ensure_ascii=False,separators=(",",":"))+",",1)
           p.write_text(s,encoding="utf-8")
          PY
      - name: Publish
        run: |
          git config user.name "FLX website automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html images/foxconn-p1-*.webp
          if ! git diff --cached --quiet; then
            git commit -m "Publish Foxconn P1 gallery with 14 numbered photos"
            git push
          fi
